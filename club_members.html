
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Member Manager</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: "Courier New", monospace;
            background: linear-gradient(135deg, #fff9d9, #e1fbf4, #fff6cf);
            color: #2b1a0b;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px 30px;
            background: #713500;
            border-radius: 15px;
            margin-bottom: 40px;
        }

        .brand {
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffe6a7;
            text-decoration: underline;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 35px;
            background: linear-gradient(135deg, #fffde7, #e1faf4, #fff9d6);
            border: 8px solid #713500;
            border-radius: 25px;
            box-shadow: 0 8px 25px #71350025;
        }

        h1 {
            font-size: 30px;
            font-weight: normal;
            margin: 0 0 25px;
            overflow-wrap: anywhere;
            color: #2b1a0b;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #d9c8b5;
            border-radius: 13px;
            font-family: inherit;
            font-size: 15px;
            background-color: #ffffff;
            color: #2b1a0b;
            box-shadow: 0 7px 10px #00000025;
        }

        button {
            padding: 10px 15px;
            background: #713500;
            color: white;
            border: 2px solid #713500;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #542600;
        }

        #result {
            margin-top: 25px;
            padding: 20px 15px;
            background-color: #e1faf4;
            border: 4px solid #713500;
            border-radius: 12px;
            line-height: 1.8;
            overflow-wrap: anywhere;
            color: #2b1a0b;
        }

        #result h2 {
            font-size: 15px;
            font-weight: normal;
            margin: 0 0 5px;
            color: #713500;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 15px;
                justify-content: center;
            }

            .nav-links {
                justify-content: center;
                gap: 12px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="brand">My Website</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="element_checker.html">Element Checker</a>
            <a href="club_members.html" class="active">Club Members</a>
            <a href="creator.html">Meet the Creator</a>
        </div>
    </nav>

    <div class="container">

        <h1>ADD NEW CLUB MEMBER:</h1>

        <input type="text" id="first_name" placeholder="First Name">
        <input type="text" id="last_name" placeholder="Last Name">

        <button py-click="add_member">Submit</button>

        <div id="result"></div>

    </div>

    <script type="py" src="./club_members.py"></script>

</body>
</html>
